<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="author" content="Ego">
        <meta name="description" content="This is a webpage about a tech club">
        <title>Home</title>
    </head>

<body>
<header>
    <h1>Tech Club</h1>

    <nav aria-label="Main Menu">
        <a href="#about">About</a>
        <a href="#events">Events</a>
        <a href="#join">Join</a>
    </nav>
</header>

<main>
<h2 id="about">About Us</h2>
<p>We are a student technology club learning how to build useful things on the web.</p>

<section id="events">
    <h2>Upcoming Events</h2>

<article>
<ul>
    
    <li>
        <h3>HTML Workshop</h3>
        <p>Saturday at 10am</p>
    </li>
    


    <li>
        <h3>Git Practice</h3>
        <p>Sunday at 2pm</p>
    </li>

</ul>
</article>

</section>

<img src="club.jpg" alt="image of club members">

<section id="join">
    <h2>Join the Club</h2>

    <form>
    <label for ='user-name'>Name: </label>
    <input type="text" id="user-name" name="user-name">
    <br><br>

    <label for='user-email'> Email: </label>
    <input type="email" id="user-email" name="user-email">
    <br><br>

    <label for="user-message">Why do you want to join?</label>
    <textarea id="user-message" name="user-message" rows = "5" cols="20"></textarea>
    <br><br>

    <button type="submit">Send</button>
    </form>
</section>
</main>

<footer>
    Tech Club 2026
</footer>

</body>
</html>
